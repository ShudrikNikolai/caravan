services:
  db:
    image: postgres:18.3
    container_name: db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dbdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql

  redis:
    image: redis:8.8-m03-trixie
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
